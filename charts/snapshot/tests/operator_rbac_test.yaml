suite: operator RBAC
templates:
  - templates/operator-rbac.yaml
release:
  name: snapshot
tests:
  - it: does not grant any PageBroker S3 configuration access for a PVC install
    documentSelector:
      path: kind
      value: Role
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["configmaps"]
            verbs: ["create"]

  - it: grants unscoped create and name-scoped get/update for the PageBroker S3 ConfigMap
    documentSelector:
      path: kind
      value: Role
    set:
      storage.type: s3
      storage.s3.endpoint: https://s3.example.com
      storage.s3.region: us-east-1
      storage.s3.bucket: snapshot-bucket
    asserts:
      # RBAC cannot scope create by resourceNames, so it must be its own
      # unscoped rule; a single rule with both create and resourceNames would
      # leave create silently unauthorized.
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["configmaps"]
            verbs: ["create"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["configmaps"]
            resourceNames: ["snapshot-pagebroker-storage-config"]
            verbs: ["get", "update"]

  - it: keeps the generated operator service account by default
    documentSelector:
      path: kind
      value: ServiceAccount
    asserts:
      - equal:
          path: metadata.name
          value: snapshot-operator

  - it: creates a custom operator service account when requested
    set:
      operator.serviceAccount.name: authorized-operator
    documentSelector:
      path: kind
      value: ServiceAccount
    asserts:
      - equal:
          path: metadata.name
          value: authorized-operator

  - it: reuses an existing account without creating a duplicate
    set:
      operator.serviceAccount.create: false
      operator.serviceAccount.name: authorized-operator
    asserts:
      - hasDocuments:
          count: 4

  - it: grants controller permissions to the configured account
    set:
      operator.serviceAccount.create: false
      operator.serviceAccount.name: authorized-operator
    documentSelector:
      path: kind
      value: ClusterRoleBinding
    asserts:
      - equal:
          path: subjects[0].name
          value: authorized-operator

  - it: grants leader election permissions to the configured account
    set:
      operator.serviceAccount.create: false
      operator.serviceAccount.name: authorized-operator
    documentSelector:
      path: kind
      value: RoleBinding
    asserts:
      - equal:
          path: subjects[0].name
          value: authorized-operator
